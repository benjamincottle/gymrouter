# The gyms the app knows about. Public data only: where each gym is, and the lines that serve the gym end.
# The app adds the lines near each person's home (suggested from the timetable) on their own device.
#
# Addresses: 9degrees.com.au/locations. To add a gym, append a [[gym]] block (rebuild to ship it).
#
# Optional measured walks from the gym door to a stop. Planners guess these badly (through the factory,
# round the shortcut), so curated ones are where this app can beat them. If a gym has none, every stop
# within the walking limit is considered.
#
#   [[gym.access]]
#   stop = "206638"          # GTFS stop_id
#   name = "Mars Rd Stop"    # shown in the app
#   walk_s = 300

