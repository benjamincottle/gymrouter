<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Gym Router</title>
  <!-- A transit line, with one stop on the way, arriving at the foot of a climbing volume bolted to the wall.
       Bolt holes every 12 units; the line runs along a row of them and the volume's bolt sits in one. -->
  <defs><clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath></defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#1e2226"/>
    <g fill="#ebeeea" opacity="0.12"><circle cx="8" cy="8" r="1.2"/><circle cx="20" cy="8" r="1.2"/><circle cx="32" cy="8" r="1.2"/><circle cx="44" cy="8" r="1.2"/><circle cx="56" cy="8" r="1.2"/><circle cx="8" cy="20" r="1.2"/><circle cx="20" cy="20" r="1.2"/><circle cx="32" cy="20" r="1.2"/><circle cx="44" cy="20" r="1.2"/><circle cx="56" cy="20" r="1.2"/><circle cx="8" cy="32" r="1.2"/><circle cx="20" cy="32" r="1.2"/><circle cx="32" cy="32" r="1.2"/><circle cx="44" cy="32" r="1.2"/><circle cx="56" cy="32" r="1.2"/><circle cx="8" cy="44" r="1.2"/><circle cx="20" cy="44" r="1.2"/><circle cx="32" cy="44" r="1.2"/><circle cx="44" cy="44" r="1.2"/><circle cx="56" cy="44" r="1.2"/><circle cx="8" cy="56" r="1.2"/><circle cx="20" cy="56" r="1.2"/><circle cx="32" cy="56" r="1.2"/><circle cx="44" cy="56" r="1.2"/><circle cx="56" cy="56" r="1.2"/></g>
    <path d="M-4 44 H20" stroke="#f99d1c" stroke-width="7" stroke-linecap="round"/>
    <path d="M8 44 V37" stroke="#f99d1c" stroke-width="4"/>
    <g stroke-width="2.4" stroke-linejoin="round">
      <path d="M22 44 L48 9 L44 32 Z" fill="#ebeeea" stroke="#ebeeea"/>
      <path d="M48 9 L58 44 L44 32 Z" fill="#b4bcb4" stroke="#b4bcb4"/>
      <path d="M22 44 L44 32 L58 44 Z" fill="#7d867e" stroke="#7d867e"/>
    </g>
    <circle cx="44" cy="32" r="2.3" fill="#1e2226"/>
  </g>
</svg>
