name: Build and publish image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - cmd/**
      - internal/**
      - proto/**
      - go.mod
      - go.sum
      - web/**
      - .github/workflows/build.yml
  schedule:
    # Daily digest check of the images the Dockerfile takes by a floating tag (the distroless runtime base).
    - cron: '23 16 * * *'
  workflow_dispatch: {}

# Cancel a superseded run, but keep push/schedule/dispatch runs from cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  DIGEST_FILE: .cache/upstream-digest

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore last-known upstream digests
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DIGEST_FILE }}
          key: upstream-digest-${{ github.run_id }}
          restore-keys: |
            upstream-digest-

      # One digest over every image the Dockerfile takes by a floating tag, read from its FROM lines: today
      # the runtime base. The images pinned by digest (Go, Node, pmtiles) only change with a push, when
      # Dependabot's pull request is merged.
      - name: Get upstream image digests
        id: upstream
        run: |
          images="$(awk 'toupper($1) == "FROM" { for (i = 2; i <= NF; i++) if ($i !~ /^--/) { print $i; break } }' Dockerfile | grep -v '@sha256:' | sort -u)"
          manifests="$RUNNER_TEMP/upstream-manifests"
          : > "$manifests"
          for image in $images; do
            echo "$image" >> "$manifests"
            docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' >> "$manifests"
          done
          digest="$(sha256sum "$manifests" | cut -d' ' -f1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Compare against last-known digests
        id: compare
        run: |
          stored=""
          if [ -f "$DIGEST_FILE" ]; then
            stored="$(cat "$DIGEST_FILE")"
          fi
          if [ "$stored" = "${{ steps.upstream.outputs.digest }}" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.compare.outputs.changed == 'true'
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        if: steps.compare.outputs.changed == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.compare.outputs.changed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Record upstream digests for cache
        run: |
          mkdir -p "$(dirname "$DIGEST_FILE")"
          echo "${{ steps.upstream.outputs.digest }}" > "$DIGEST_FILE"
