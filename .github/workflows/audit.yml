name: Dependency audit

on:
  push:
    # main only: a PR branch push would otherwise fire push and pull_request for the same commit.
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - web/package.json
      - web/package-lock.json
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - go.mod
      - go.sum
      - web/package.json
      - web/package-lock.json
      - .github/workflows/audit.yml
  schedule:
    - cron: '47 16 * * *'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Reports only vulnerabilities in code paths the binary actually calls.
  govulncheck:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # go.mod names an exact patch release, so that's the one audited: a standard-library advisory
          # fails this job until the go directive is bumped, and that push rebuilds the image.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  npm-audit:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Production dependencies only: they're what ships to the browser.
      - name: npm audit
        run: npm audit --omit=dev --audit-level=moderate
