# Gym Router configuration (example).
#
# Infrastructure and tuning only. Gyms, homes and the lines that matter for each live on the device and are
# set up in the app (it suggests lines from the timetable). The real config lives in the private deploy repo and
# is mounted into the container. Secrets come from the environment:
#   TFNSW_API_KEY    Transport for NSW Open Data API key
#   GYMROUTER_TOKEN  access token (generate with `gymrouter new-token`)
#
# The [[gym]] sections below are optional presets: a device can import them in one tap, and the server preloads
# their lines at startup (a faster first request). Delete them to start from nothing.

[server]
listen = ":8080"
data_dir = "/data"
public_url = "https://gym.example.com"
trust_proxy = true

[routing]
max_transfer_m = 400      # longest walking change between stops
walk_speed_mps = 1.3      # default; devices can set their own
detour_factor = 1.3       # straight line → walking distance
min_change_s = 60         # buffer when changing at the same stop
max_rides = 4
max_walk_m = 1000         # to/from the first/last stop when not curated
alternatives_s = 600      # also show different routes arriving within 10 min of the best
static_refresh_hour = 5   # local time for the daily timetable download

[risk]                    # defaults; devices can tune these
safe_s = 180
tight_s = 60

[realtime]
trip_updates_every = "30s"
vehicles_every = "15s"
active_for = "10m"        # poll only while the app was used in the last 10 minutes
daily_budget = 40000      # hard cap on upstream requests (free plan quota is 60,000/day)

# Presets. Addresses: 9degrees.com.au/locations. Lines here are only the gym end; the app adds the lines near home.
[[gym]]
id = "lanecove"
name = "9 Degrees Lane Cove"
address = "1a/21 Mars Rd, Lane Cove West"
lat = -33.807948
lon = 151.150629
lines = ["train T1", "train T9", "metro M1", "bus 288", "bus 291", "bus 292", "bus 533", "bus 287"]
