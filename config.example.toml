# Gym Router configuration (example): infrastructure only.
#
# Gyms are built into the app (internal/gyms/gyms.toml); homes and the lines near them live on each device.
# Routing and connection-risk defaults are compiled in and overridden per device in Settings.
# Secrets come from the environment, not from this file:
#   TFNSW_API_KEY    Transport for NSW Open Data API key
#   GYMROUTER_TOKEN  access token (generate with `gymrouter new-token`)
#
# Every value below is optional; these are the defaults, except public_url and trust_proxy.

[server]
listen = ":8080"
data_dir = "/data"
public_url = "https://gym.example.com"   # used by `gymrouter setup-link`
trust_proxy = true                       # log the client IP from X-Forwarded-For (set by Traefik)
static_refresh_hour = 5                  # local time for the daily timetable download

[realtime]
trip_updates_every = "30s"
vehicles_every = "15s"
active_for = "10m"        # poll only while the app was used in the last 10 minutes
daily_budget = 40000      # hard cap on upstream requests (free plan quota is 60,000/day)
